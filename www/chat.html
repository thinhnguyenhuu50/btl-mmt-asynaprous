<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AsynapRous Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

    /* Login screen */
    #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: #16213e; padding: 32px; border-radius: 12px; width: 340px; }
    .login-box h2 { margin-bottom: 20px; color: #e94560; }
    .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #333; border-radius: 6px; background: #0f3460; color: #eee; }
    .login-box button { width: 100%; padding: 10px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
    .login-box button:hover { background: #c73650; }
    .login-error { color: #e94560; font-size: 13px; margin-top: 8px; }

    /* Chat screen */
    #chat-screen { display: none; flex: 1; flex-direction: row; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 240px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #333; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #333; }
    .sidebar-header h3 { color: #e94560; font-size: 16px; }
    .sidebar-header .user-info { font-size: 13px; color: #999; margin-top: 4px; }
    .sidebar-section { padding: 12px 16px 4px; font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
    .channel-list { flex: 1; overflow-y: auto; }
    .channel-item { padding: 8px 16px; cursor: pointer; display: flex; align-items: center; }
    .channel-item:hover { background: #0f3460; }
    .channel-item.active { background: #0f3460; border-left: 3px solid #e94560; }
    .channel-item .ch-name { flex: 1; }
    .channel-item .ch-badge { background: #e94560; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
    .peer-list { overflow-y: auto; max-height: 160px; }
    .peer-item { padding: 6px 16px; font-size: 13px; color: #aaa; }
    .peer-item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; margin-right: 6px; }

    .sidebar-actions { padding: 12px; border-top: 1px solid #333; }
    .sidebar-actions button { width: 100%; padding: 8px; background: #0f3460; border: 1px solid #333; color: #eee; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; }
    .sidebar-actions button:hover { background: #e94560; }

    /* Main chat area */
    .chat-main { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 14px 20px; background: #16213e; border-bottom: 1px solid #333; font-size: 16px; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin-bottom: 12px; }
    .msg .msg-author { font-weight: 600; color: #e94560; font-size: 14px; }
    .msg .msg-time { font-size: 11px; color: #666; margin-left: 8px; }
    .msg .msg-text { margin-top: 3px; font-size: 14px; line-height: 1.4; }
    .msg-input-area { display: flex; padding: 12px 20px; background: #16213e; border-top: 1px solid #333; }
    .msg-input-area input { flex: 1; padding: 10px; background: #0f3460; border: 1px solid #333; border-radius: 6px; color: #eee; font-size: 14px; }
    .msg-input-area button { margin-left: 8px; padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .msg-input-area button:hover { background: #c73650; }

    .notification { position: fixed; top: 20px; right: 20px; background: #e94560; color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 1000; display: none; }
  </style>
</head>
<body>

  <!-- Notification popup -->
  <div id="notification" class="notification"></div>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h2>AsynapRous Chat</h2>
      <input type="text" id="login-user" placeholder="Username" autocomplete="off">
      <input type="password" id="login-pass" placeholder="Password">
      <button onclick="doLogin()">Login</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>AsynapRous</h3>
        <div class="user-info">Logged in as: <strong id="user-display"></strong></div>
      </div>

      <div class="sidebar-section">Channels</div>
      <div id="channel-list" class="channel-list"></div>

      <div class="sidebar-section">Online Peers</div>
      <div id="peer-list" class="peer-list"></div>

      <div class="sidebar-actions">
        <button onclick="promptCreateChannel()">+ New Channel</button>
        <button onclick="refreshPeers()">Refresh Peers</button>
        <button onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="chat-main">
      <div class="chat-header" id="chat-header"># general</div>
      <div class="messages" id="messages"></div>
      <div class="msg-input-area">
        <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // State
    // ========================================
    let currentUser = '';
    let sessionId = '';
    let currentChannel = 'general';
    let lastTimestamp = 0;
    let pollInterval = null;

    // ========================================
    // Helpers
    // ========================================
    async function api(method, path, body) {
      const opts = {
        method: method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (sessionId) {
        opts.headers['Cookie'] = 'session_id=' + sessionId;
      }
      if (body) {
        opts.body = JSON.stringify(body);
      }
      try {
        const resp = await fetch(path, opts);
        const text = await resp.text();
        return JSON.parse(text);
      } catch (e) {
        console.error('API error:', e);
        return { status: 'error', message: e.message };
      }
    }

    function showNotification(msg) {
      const el = document.getElementById('notification');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ========================================
    // Login / Logout
    // ========================================
    async function doLogin() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;

      if (!username || !password) {
        document.getElementById('login-error').textContent = 'Please enter username and password';
        return;
      }

      const result = await api('POST', '/login/', { username, password });

      if (result.status === 'success') {
        currentUser = result.data.username;
        sessionId = result.data.session_id;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('user-display').textContent = currentUser;

        // Register peer info
        await api('POST', '/submit-info/', {
          ip: '127.0.0.1',
          port: window.location.port || 8000,
          username: currentUser
        });

        // Load initial data
        await refreshChannels();
        await refreshPeers();
        loadMessages();

        // Start polling for new messages
        pollInterval = setInterval(pollMessages, 2000);
      } else {
        document.getElementById('login-error').textContent =
          result.message || 'Login failed';
      }
    }

    function doLogout() {
      currentUser = '';
      sessionId = '';
      if (pollInterval) clearInterval(pollInterval);
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('login-pass').value = '';
    }

    // ========================================
    // Channels
    // ========================================
    async function refreshChannels() {
      const result = await api('POST', '/channels/', { username: currentUser });
      if (result.status === 'success') {
        const list = document.getElementById('channel-list');
        list.innerHTML = '';
        for (const ch of result.data.channels) {
          if (ch.is_dm) continue;  // Skip DM channels in sidebar
          const div = document.createElement('div');
          div.className = 'channel-item' + (ch.name === currentChannel ? ' active' : '');
          div.innerHTML = '<span class="ch-name"># ' + ch.name + '</span>' +
            '<span class="ch-badge">' + ch.message_count + '</span>';
          div.onclick = () => switchChannel(ch.name);
          list.appendChild(div);
        }
      }
    }

    function switchChannel(name) {
      currentChannel = name;
      lastTimestamp = 0;
      document.getElementById('chat-header').textContent = '# ' + name;
      document.getElementById('messages').innerHTML = '';
      refreshChannels();
      loadMessages();
    }

    async function promptCreateChannel() {
      const name = prompt('Enter channel name:');
      if (!name) return;

      const result = await api('POST', '/create-channel/', {
        name: name, creator: currentUser
      });

      if (result.status === 'success') {
        // Auto-join the channel
        await api('POST', '/join-channel/', {
          channel: name, username: currentUser
        });
        await refreshChannels();
        switchChannel(name);
        showNotification('Channel #' + name + ' created');
      } else {
        alert(result.message || 'Failed to create channel');
      }
    }

    // ========================================
    // Peers
    // ========================================
    async function refreshPeers() {
      const result = await api('GET', '/get-list/');
      if (result.status === 'success') {
        const list = document.getElementById('peer-list');
        list.innerHTML = '';
        for (const peer of result.data.peers) {
          const div = document.createElement('div');
          div.className = 'peer-item';
          div.innerHTML = '<span class="dot"></span>' + peer.username;
          list.appendChild(div);
        }
      }
    }

    // ========================================
    // Messages
    // ========================================
    async function loadMessages() {
      const result = await api('POST', '/messages/', {
        channel: currentChannel, since: 0
      });
      if (result.status === 'success') {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        for (const msg of result.data.messages) {
          appendMessage(msg);
          if (msg.timestamp > lastTimestamp) lastTimestamp = msg.timestamp;
        }
        container.scrollTop = container.scrollHeight;
      }
    }

    async function pollMessages() {
      const result = await api('POST', '/messages/', {
        channel: currentChannel, since: lastTimestamp
      });
      if (result.status === 'success' && result.data.messages.length > 0) {
        const container = document.getElementById('messages');
        for (const msg of result.data.messages) {
          appendMessage(msg);
          if (msg.timestamp > lastTimestamp) lastTimestamp = msg.timestamp;
        }
        container.scrollTop = container.scrollHeight;

        // Show notification if message is from another user
        const lastMsg = result.data.messages[result.data.messages.length - 1];
        if (lastMsg.from !== currentUser) {
          showNotification('New message from ' + lastMsg.from);
        }
      }
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML =
        '<span class="msg-author">' + (msg.from || 'unknown') + '</span>' +
        '<span class="msg-time">' + formatTime(msg.timestamp) + '</span>' +
        '<div class="msg-text">' + escapeHtml(msg.text || msg.message || '') + '</div>';
      container.appendChild(div);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========================================
    // Send Message
    // ========================================
    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      const result = await api('POST', '/broadcast-peer/', {
        from: currentUser,
        message: text,
        channel: currentChannel
      });

      if (result.status === 'success') {
        // Immediately load messages to see our own
        await pollMessages();
      }
    }
  </script>
</body>
</html>
